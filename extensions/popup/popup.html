<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Document.io Companion</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, -apple-system, sans-serif; width: 300px; padding: 16px; color: #1e293b; background: #fff; }
      h1 { font-size: 13px; font-weight: 600; color: #0f172a; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
      h1 span { color: #6366f1; }
      label { display: block; font-size: 11px; font-weight: 500; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
      input { display: block; width: 100%; padding: 7px 10px; font-size: 12px; border: 1px solid #e2e8f0; border-radius: 7px; outline: none; color: #0f172a; transition: border-color 0.15s; }
      input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
      button { margin-top: 10px; width: 100%; padding: 8px; font-size: 12px; font-weight: 500; background: #6366f1; color: #fff; border: none; border-radius: 7px; cursor: pointer; transition: background 0.15s; }
      button:hover { background: #4f46e5; }
      .hint { font-size: 11px; color: #94a3b8; margin-top: 6px; }
      .status { font-size: 11px; margin-top: 8px; color: #22c55e; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>Document.io <span>Companion</span></h1>
    <label for="host">Server URL</label>
    <input id="host" type="url" placeholder="http://localhost:5001" />
    <p class="hint">The URL of your document.io server.</p>
    <button id="save">Save</button>
    <p class="status" id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
